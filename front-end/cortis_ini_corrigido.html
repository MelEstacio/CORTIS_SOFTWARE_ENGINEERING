<!DOCTYPE html>

    <div class="conteudo_cortina">
        <a href="cortis_initial.html" class="cortis_logo" aria-label="Voltar para a página inicial">
            <img src="itens/cortis_icon.svg" alt="">

        <nav class="os_quatro_botoes_topo" aria-label="Navegação principal">
            <ul>
                <li><a href="concepts.html">CONCEPTS</a></li>
                <li><a href="members.html">MEMBERS</a></li>
                <li><a href="fashion.html">FASHION</a></li>

            <a href="user_area.html" class="botoes_lateral_um" aria-label="Acessar minha conta">

</section>
<section id="singles_area">
    <ul id="eps_images">
        <li>
            <img src="itens/cortis_color_cover.webp" alt="Capa do EP Color Outside the Lines" class="active" id="singles_image_one">
            <h3 class="ep_one_name">COLOR OUTSIDE THE LINES - EP 1</h3>
        </li>
        <li>
            <img src="itens/greengreen_cover.webp" alt="Capa do EP Green Green" id="singles_image_two">
            <h3 class="ep_two_name">COLOR OUTSIDE THE LINES - EP 2</h3>
        </li>
    </ul>
    <button class="slide_left" aria-label="Slide anterior"><img src="itens/arrow_left_white.svg" alt=""></button>

        <li><button class="dot_one" aria-label="Ir para o slide 1" aria-current="true"><img src="itens/dot_green.svg" alt=""></button></li>
        <li><button class="dot_two" aria-label="Ir para o slide 2"><img src="itens/dot_grey.svg" alt=""></button></li>
    </ul>
</section>
<section id="light_green_area">
    <div class="social_icons">
        <button class="tiktok_icon" aria-label="Visitar nosso TikTok"><img src="itens/tiktok_icon.svg" alt=""></button>

        <button class="more">MORE</button>

            <li><img src="itens/keonho_pic.webp" alt="Keonho" id="weverse_pic_three"></li>
            <li><img src="itens/james_pic.webp" alt="James" id="weverse_pic_four"></li>
        </ul>

        <button class="green_arrow_right" aria-label="Próxima foto"><img src="itens/arrow_right_green.svg" alt=""></button>
